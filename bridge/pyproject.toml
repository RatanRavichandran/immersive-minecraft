[project]
name = "skysync-bridge"
version = "1.0.0"
description = "Receives Minecraft sky telemetry over UDP and drives a WiZ bulb to match it."
requires-python = ">=3.11"
dependencies = [
    "pywizlight>=0.6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
